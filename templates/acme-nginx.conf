# HTTP-01 only. Separate from the website's TLS/PROXY listener.
worker_processes 1;
pid /run/xray-skill-acme/nginx.pid;
error_log /dev/null crit;
events { worker_connections 128; }
http {
    access_log off;
    server_tokens off;
    default_type text/plain;
    client_body_temp_path /run/xray-skill-acme/body;
    proxy_temp_path /run/xray-skill-acme/proxy;
    fastcgi_temp_path /run/xray-skill-acme/fastcgi;
    uwsgi_temp_path /run/xray-skill-acme/uwsgi;
    scgi_temp_path /run/xray-skill-acme/scgi;
    server {
        listen 80;
        listen [::]:80;
        server_name _;
        location ~ "^/\.well-known/acme-challenge/[A-Za-z0-9_-]+$" {
            root /var/lib/xray-skill-acme;
            try_files $uri =404;
        }
        location / { return 404; }
    }
}
