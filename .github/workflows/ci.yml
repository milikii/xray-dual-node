name: Validate Skill
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq unzip ripgrep python3
      - name: Validate instructions and helpers
        run: |
          tests/check-skill.sh
          tests/unit/helper-contracts.sh
          tests/unit/private-export.sh
      - name: Verify the fixed core and loopback routing
        run: |
          scripts/fetch-xray.sh --output-dir /tmp/xray-skill-ci-core
          tools/poc/local-routing.sh --xray /tmp/xray-skill-ci-core/xray
